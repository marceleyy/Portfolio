<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détection en temps réel</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        h1 { color: #333; }
        .stage { position: relative; display: inline-block; margin-top: 20px; }
        video { border: 1px solid black; display: block; }
        #overlay { position: absolute; top: 0; left: 0; }
        #results { margin-top: 20px; font-weight: bold; }
        #loading { color: red; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <h1>Détection de comportements suspects</h1>
    <div class="stage">
        <video id="cameraFeed" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="results"></div>
    <div id="loading">Analyse en cours…</div>

    <script src="script.js"></script>
</body>
</html>
